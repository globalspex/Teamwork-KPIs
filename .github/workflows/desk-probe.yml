# TEMPORARY: runs the Desk probe when the probe script changes. Delete after the Desk sync is built.
name: Desk probe (temporary)
on:
  push:
    paths: ['scripts/desk_probe.py', '.github/workflows/desk-probe.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Desk API
        env:
          TEAMWORK_PASSWORD: ${{ secrets.TEAMWORK_PASSWORD }}
          TEAMWORK_SITE: globalspex
        run: python scripts/desk_probe.py
      - name: Commit probe output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/desk-probe.json
          git diff --cached --quiet && exit 0
          git commit -m "Desk probe output"
          git pull --rebase
          git push
